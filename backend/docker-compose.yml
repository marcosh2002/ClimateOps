version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climatify-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=sqlite:///./climatify.db
      - REDIS_URL=redis://redis:6379/0
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=us-east-1
      - MONITORING_INTERVAL_MINUTES=5
      - SIMULATION_MODE_ENABLED=true
    env_file:
      - .env
    volumes:
      - .:/app
      - ./config:/app/config
    depends_on:
      - dynamodb
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: climatify-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  redis:
    image: redis:7-alpine
    container_name: climatify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Optional: LocalStack for full AWS local simulation
  # localstack:
  #   image: localstack/localstack:latest
  #   container_name: climatify-localstack
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=dynamodb,s3,lambda,events
  #     - DEBUG=1
  #   volumes:
  #     - localstack_data:/var/lib/localstack
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dynamodb_data:
  redis_data:
  # localstack_data: